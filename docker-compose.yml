services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: storyforge
      POSTGRES_PASSWORD: storyforge
      POSTGRES_DB: storyforge
    ports:
      - "5432:5432"
    volumes:
      - storyforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyforge -d storyforge"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  storyforge_pg:
